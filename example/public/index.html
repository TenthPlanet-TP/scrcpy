<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>scrcpy Encode Monitor</title>
  <style>
    :root {
      --bg: #0e1116;
      --card: #161b23;
      --border: #232b36;
      --text: #d7dde6;
      --muted: #7b8694;
      --accent: #4f8ef7;
      --ok: #2ecc8f;
      --err: #f75f5f;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      padding: 10px 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.4 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }
    header {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: none;
    }
    .encOnly, .sysOnly { transition: none; }
    body[data-tab="enc"] .sysOnly { display: none; }
    body[data-tab="sys"] .encOnly { display: none; }
    #conn.up { color: var(--ok); }
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      color: var(--muted); font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .badge b { color: var(--text); font-weight: 600; }
    .badge.alert b { color: var(--err); }
    .ymax {
      color: var(--muted); font-size: 11px; line-height: 1;
      padding: 2px 7px; border: 1px solid var(--border); border-radius: 4px;
      cursor: pointer; user-select: none;
      font-variant-numeric: tabular-nums;
    }
    .ymax:hover { color: var(--text); }
    .legend span { cursor: pointer; }
    .legend span.off { opacity: .35; }
    header .spacer { flex: 1; }
    button {
      background: #1d242f;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 14px;
      font: inherit;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    button:hover { background: #263042; border-color: #33405273; }
    #pauseBtn.paused { border-color: #a9603a; color: #f5a623; }
    .tab {
      padding: 4px 12px;
      font-size: 13px;
    }
    .tab.on { color: var(--accent); border-color: #33425a; }
    main {
      flex: 1;
      min-height: 0;
      overflow: hidden; /* 单页:卡高由视口分配,不滚动 */
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .group { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .group.hidden { display: none; }
    .group .grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr 1fr;
      gap: 8px;
      padding: 0 10px 4px;
    }
    .card.span2 { grid-column: span 2; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .card-head {
      flex: none;
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 6px 10px 2px;
    }
    .card-title { font-size: 13px; font-weight: 600; }
    .legend {
      display: inline-flex; gap: 10px;
      font-size: 11px; color: var(--muted);
    }
    .legend i {
      display: inline-block; width: 8px; height: 8px;
      border-radius: 2px; margin-right: 4px; vertical-align: baseline;
    }
    .stats {
      margin-left: auto;
      font-size: 11px; color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .stats b { color: var(--text); font-weight: 600; }
    .card canvas { flex: 1; min-height: 0; width: 100%; display: block; }
    .card-foot {
      flex: none;
      display: flex; align-items: center; gap: 8px;
      padding: 2px 10px 6px;
      color: var(--muted); font-size: 11px;
    }
    input[type=range] {
      flex: 1;
      -webkit-appearance: none; appearance: none;
      height: 4px; border-radius: 2px;
      background: #2a3340;
      outline: none; margin: 0;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--accent);
      cursor: ew-resize;
      border: 2px solid #0e1116;
      box-shadow: 0 0 0 1px var(--accent);
    }
    input[type=range]::-moz-range-thumb {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--accent); border: none; cursor: ew-resize;
    }
    .win-label { min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
    #pkgInput {
      background: #1d242f;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      font: inherit; font-size: 12px;
      width: 210px;
      outline: none;
    }
    #pkgInput:focus { border-color: #33425a; }
  </style>
</head>
<body>
  <header>
    <button id="tabEnc" class="tab on">Encode</button>
    <button id="tabSys" class="tab">PerfCat</button>
    <span id="conn"><span class="dot"></span><span id="connText">connecting…</span></span>
    <span class="badge encOnly" id="badgeDrop" title="Dropped frames by broadcast queue (server seq gaps); non-zero means curves are incomplete">drop <b>0</b></span>
    <span class="badge sysOnly" id="badgeSys" title="Device status (1Hz): battery temp · level · available RAM; -- = not provided">--℃ · ⚡--% · avail --G</span>
    <input class="sysOnly" id="pkgInput" placeholder="package → app CPU/PSS/IO" title="Type an Android package (e.g. com.android.systemui) and press Enter to sample; clear + Enter to stop">
    <span class="spacer"></span>
    <button id="clearBtn" title="Clear all chart data">Clear</button>
    <button class="encOnly" id="exportBtn" title="Export per-frame data of the current window as CSV">Export CSV</button>
    <button class="sysOnly" id="exportSysBtn" title="Export 1Hz summary (fps/system/app metrics) as CSV">Export 1Hz</button>
    <button id="pauseBtn" title="Pause/resume receiving data">⏸ Pause</button>
  </header>
  <main id="charts"></main>

  <script>
  'use strict';
  /* ------------------------------------------------------------------
   * 图表配置:全部由该表驱动,新增曲线只需加一行
   *   kind: 'bar' | 'line'
   *   yMin/yMax: 纵轴范围; yStep: 细网格; yLabelStep: 刻度文字
   *   src: 数据数组; get: 取值函数; scale: 显示前的换算(KB/Mbps)
   * ------------------------------------------------------------------ */
  var BITRATE_DIV = 1000; // server 的 kbps 为十进制(bits/s /1000),Mbps = /1000,与 MediaCodec/ffprobe 一致

  var frames = []; // {t, size, qp, cost, interval, outInterval, jitter, key, seq, pts_ms, ts_ms}
  var stats  = []; // {t, fps, kbps}
  var drops  = []; // {t, n} — server 序列号跳变感知到的广播丢帧

  var CHARTS = [
    { id: 'size',   title: 'FrameSize(KB)',   kind: 'bar',  color: '#4f8ef7',
      yMin: 0, yMax: 350, yStep: 50, yLabelStep: 50, unit: '',
      src: frames, get: function (d) { return d.size / 1024; }, digits: 0 },
    { id: 'qp',     title: 'QP',              kind: 'line', color: '#2ecc8f',
      yMin: 0, yMax: 60, yStep: 5, yLabelStep: 10, unit: '',
      src: frames, get: function (d) { return d.qp; }, digits: 0 },
    { id: 'cost',   title: 'encode_cost(ms)', kind: 'line', color: '#f5a623',
      yMin: 0, yMax: 60, yStep: 10, yLabelStep: 10, unit: '',
      src: frames, get: function (d) { return d.cost; }, digits: 0 },
    { id: 'interval', title: 'out−in & jitter(ms)', kind: 'line',
      yMin: -40, yMax: 40, yStep: 10, yLabelStep: 20, unit: '', digits: 0, src: frames,
      series: [
        { name: 'out−in', color: '#f5a623', get: function (d) { return d.lag; } },
        { name: 'jitter', color: '#b57df0', get: function (d) { return d.jitter; } }
      ] },
    { id: 'fps',    title: 'EncodeFPS',        kind: 'line', color: '#38c8d8', gapJoin: true,
      yMin: 0, yMax: 75, yStep: 5, yLabelStep: 15, unit: '',
      src: stats, get: function (d) { return d.fps; }, digits: 0 },
    { id: 'bitrate', title: 'Bitrate(Mbps)',  kind: 'bar',  color: '#e8c558',
      yMin: 0, yMax: 12, yStep: 3, yLabelStep: 3, unit: '',
      src: stats, get: function (d) { return d.kbps / BITRATE_DIV; }, digits: 1 },
    /* ---- 系统资源(1Hz;gapJoin:跨缺口连线——两路采样(server/app.js)节奏不齐,
       且设备指标偶发缺席,断线式绘制会把曲线切碎;字段缺席的整段缺口直接连过) ---- */
    { group: 'sys', id: 'fpsSys', title: 'SysFPS', kind: 'line', gapJoin: true, color: '#38c8d8',
      yMin: 0, yMax: 75, yStep: 5, yLabelStep: 15, unit: '', digits: 0,
      src: stats, get: function (d) { return d.sysFps; } },
    { group: 'sys', id: 'cpu', title: 'CPU(%)', kind: 'line', gapJoin: true,
      yMin: 0, yMax: 100, yStep: 10, yLabelStep: 20, unit: '', digits: 1, src: stats,
      series: [
        { name: 'total', color: '#5aa2ff', get: function (d) { return d.cpuTotal; } },
        { name: 'app', color: '#2ecc8f', get: function (d) { return d.appCpu; } }
      ] },
    { group: 'sys', id: 'mem', title: 'AppPSS(MB)', kind: 'line', gapJoin: true, color: '#e8c558',
      yMin: 0, yMax: 300, yStep: 50, yLabelStep: 100, unit: '', digits: 1,
      src: stats, get: function (d) { return d.appPss; } },
    { group: 'sys', id: 'net', title: 'Net(KB/s)', kind: 'line', gapJoin: true,
      yMin: 0, yMax: 2048, yStep: 256, yLabelStep: 512, unit: '', digits: 0, src: stats,
      series: [
        { name: 'rx', color: '#38c8d8', get: function (d) { return d.netRx; } },
        { name: 'tx', color: '#e8c558', get: function (d) { return d.netTx; } }
      ] },
    { group: 'sys', id: 'gpu', title: 'GPU(%)', kind: 'line', gapJoin: true, color: '#f78ef7',
      yMin: 0, yMax: 100, yStep: 10, yLabelStep: 20, unit: '', digits: 0,
      src: stats, get: function (d) { return d.gpuUtil; } },
    { group: 'sys', id: 'io', title: 'IO(KB/s)', kind: 'line', gapJoin: true,
      yMin: 0, yMax: 1024, yStep: 128, yLabelStep: 256, unit: '', digits: 0, src: stats,
      series: [
        { name: 'r', color: '#2ecc8f', get: function (d) { return d.ioRead; } },
        { name: 'w', color: '#f5a623', get: function (d) { return d.ioWrite; } }
      ] }
  ];

  // 滑块档位:索引 -> 时间窗(秒),perfDog 式缩放
  var WIN_STEPS = [2, 3, 5, 10, 15, 30, 60];
  var MAX_WIN = WIN_STEPS[WIN_STEPS.length - 1];

  /* ---------------- DOM 构建 ---------------- */
  var mainEl = document.getElementById('charts');
  // 分组容器:enc(编码链路,默认)与 sys(系统资源);tab 互斥展示,数据持续采集
  var groupEls = { enc: null, sys: null };
  var groupSections = { enc: null, sys: null };
  CHARTS.forEach(function (c) {
    var group = c.group || 'enc';
    if (!groupEls[group]) {
      var g = document.createElement('section');
      g.className = 'group ' + group + (group === 'sys' ? ' hidden' : '');
      g.innerHTML = '<div class="grid"></div>'; // 组标题省略:tab 按钮已标识当前组
      mainEl.appendChild(g);
      groupSections[group] = g;
      groupEls[group] = g.querySelector('.grid');
    }
    // series 归一:显式 series 或由 color/get 包装单系列;c.get 保留为主线别名(bar 路径复用)
    if (!c.series) {
      c.series = [{ name: '', color: c.color, get: c.get }];
    }
    c.get = c.series[0].get;
    c.color = c.series[0].color;
    var card = document.createElement('section');
    card.className = 'card' + (c.span2 ? ' span2' : '');
    var legendHtml;
    if (c.id === 'size') {
      // P/I 为同系列的柱色区分(关键帧),不做系列开关
      legendHtml = '<span class="legend"><span><i style="background:' + c.color + '"></i>P</span>' +
                   '<span><i style="background:#f75f5f"></i>I</span></span>';
    } else {
      legendHtml = '<span class="legend">' + c.series.map(function (s) {
        return '<span><i style="background:' + s.color + '"></i>' + (s.name || '') + '</span>';
      }).join('') + '</span>';
    }
    card.innerHTML =
      '<div class="card-head"><span class="card-title">' + c.title + '</span>' + legendHtml +
      '<span class="ymax" title="Click to cycle Y range (1/4 → 1/2 → 1 → 2 → 4x)"></span>' +
      '<span class="stats"></span></div>' +
      '<canvas></canvas>' +
      '<div class="card-foot"><span>zoom</span><input type="range" min="0" max="' +
      (WIN_STEPS.length - 1) + '" step="1" value="3"><span class="win-label">10s</span></div>';
    groupEls[c.group || 'enc'].appendChild(card);

    c.canvas = card.querySelector('canvas');

    // Y 轴档位:点击循环 base 的 1/4 → 1/2 → 1 → 2 → 4 倍(yMin<0 的卡对称缩放)
    var RATIOS = [0.25, 0.5, 1, 2, 4];
    c.yMax0 = c.yMax; c.yMin0 = c.yMin; c.yStep0 = c.yStep; c.yLabelStep0 = c.yLabelStep;
    var ratioIdx = 2, ymaxEl = card.querySelector('.ymax');
    function applyRatio() {
      var r = RATIOS[ratioIdx];
      c.yMax = Math.max(1, Math.round(c.yMax0 * r));
      c.yMin = c.yMin0 < 0 ? -c.yMax : 0;
      c.yStep = Math.max(1, Math.round(c.yStep0 * r));
      c.yLabelStep = Math.max(1, Math.round(c.yLabelStep0 * r));
      ymaxEl.textContent = (c.yMin < 0 ? '±' : '') + c.yMax;
    }
    applyRatio();
    ymaxEl.addEventListener('click', function () {
      ratioIdx = (ratioIdx + 1) % RATIOS.length; applyRatio();
    });
    // 图例项点击开关系列(多系列卡)
    if (c.series.length > 1) {
      var spans = card.querySelectorAll('.legend span');
      c.series.forEach(function (s, si) {
        spans[si].addEventListener('click', function () {
          s.hidden = !s.hidden;
          spans[si].classList.toggle('off', s.hidden);
        });
      });
    }
    c.ctx = c.canvas.getContext('2d');
    c.statsEl = card.querySelector('.stats');
    c.slider = card.querySelector('input[type=range]');
    c.winLabel = card.querySelector('.win-label');
    c.win = WIN_STEPS[+c.slider.value];
    c.slider.addEventListener('input', function () {
      c.win = WIN_STEPS[+c.slider.value];
      c.winLabel.textContent = c.win + 's';
    });
  });

  /* ---------------- 数据接收 ----------------
   * onmessage 只做入队(不解析、不绘制),解析摊到绘制帧,
   * 暂停期间消息在此直接丢弃(需求 12:不缓存、丢失即可)。 */
  var pendingRaw = [];
  var paused = false;
  var prevPtsMs = -1;
  var prevTsMs = -1;
  var prevSeq = -1;
  var intervalBase = -1; // 帧间隔慢速 EMA 基准,自适应 30/60fps
  var ws = null;
  var reconnectTimer = null;

  function connect() {
    var conn = document.getElementById('conn');
    var connText = document.getElementById('connText');
    ws = new WebSocket('ws://' + location.host, 'scrcpy'); // 与页面同端口,随 WEB_PORT 变化
    ws.onopen = function () {
      conn.classList.add('up');
      connText.textContent = 'connected';
    };
    ws.onmessage = function (ev) {
      if (!paused) pendingRaw.push(ev.data);
    };
    ws.onclose = function () { scheduleReconnect(); };
    ws.onerror = function () { ws.close(); };
  }

  function scheduleReconnect() {
    var conn = document.getElementById('conn');
    var connText = document.getElementById('connText');
    conn.classList.remove('up');
    connText.textContent = 'disconnected, reconnecting…';
    if (reconnectTimer) return;
    reconnectTimer = setTimeout(function () {
      reconnectTimer = null;
      connect();
    }, 2000);
  }
  connect();

  // 绘制帧内批量解析;interval 由相邻 pts_ms 差推导(server 未下发该字段)
  function drainPending() {
    if (!pendingRaw.length) return;
    var batch = pendingRaw;
    pendingRaw = [];
    for (var i = 0; i < batch.length; i++) {
      var obj;
      try { obj = JSON.parse(batch[i]); } catch (e) { continue; }
      if (!obj || !obj.data) continue;
      var now = performance.now() / 1000;
      if (obj.type === 'frame') {
        var d = obj.data;
        // 首帧 pts=0、次帧跳到设备 uptime(基线跳变),差值>1s 视为无效
        var dv = d.pts_ms - prevPtsMs;
        var interval = (prevPtsMs >= 0 && dv >= 0 && dv <= 1000) ? dv : null;
        prevPtsMs = d.pts_ms;
        // 输出间隔:相邻 ts_ms(编码器出帧时刻)差,与输入间隔对比定位丢帧层
        var dt = d.ts_ms - prevTsMs;
        var outInterval = (prevTsMs >= 0 && dt >= 0 && dt <= 1000) ? dt : null;
        prevTsMs = d.ts_ms;
        // 广播队列 drop-oldest 丢帧由 seq 跳变感知
        if (prevSeq >= 0 && d.seq - prevSeq > 1) {
          drops.push({ t: now, n: d.seq - prevSeq - 1 });
        }
        prevSeq = d.seq;
        // jitter = 当前间隔 - 慢速基准:丢帧时正向尖峰,不随个别尖峰漂移
        var jitter = null;
        if (interval != null) {
          if (intervalBase < 0) intervalBase = interval;
          else intervalBase += (interval - intervalBase) * 0.02;
          jitter = Math.round(interval - intervalBase);
        }
        // out−in:编码器出帧间隔减产帧间隔,正常贴 0;正值成簇=编码器攒帧
        var lag = (interval != null && outInterval != null) ? outInterval - interval : null;
        frames.push({ t: now, size: d.size, qp: d.qp, cost: d.encode_cost_ms,
                      interval: interval, outInterval: outInterval, jitter: jitter, lag: lag,
                      key: !!d.isKeyFrame, seq: d.seq, pts_ms: d.pts_ms, ts_ms: d.ts_ms });
      } else if (obj.type === 'frameStat' || obj.type === 'sysStat') {
        // 两路 1Hz 消息(server 采样与 app.js 的 APP 采样)合并进同一条秒级记录:
        // 相位差可近 1s,窗口放宽 1.2s;分开成条会与 null 断线机制互斥(孤立 moveTo)
        var last = stats[stats.length - 1];
        if (!last || now - last.t > 1.2) {
          last = { t: now };
          stats.push(last);
        }
        var d2 = obj.data;
        if (obj.type === 'frameStat') {
          last.fps = d2.framerate;
          last.kbps = d2.bitrateKbps;
        } else {
          // server 侧字段(cpu_total 等)与 app.js 侧字段(app_* ,浏览器输入包名驱动)并存
          last.cpuTotal = d2.cpu_total;
          last.netRx = d2.net_rx_kbs; last.netTx = d2.net_tx_kbs;
          last.memAvail = d2.mem_avail_mb; last.tempC = d2.temp_c; last.battPct = d2.batt_pct;
          last.gpuUtil = d2.gpu_util;
          last.ioRead = d2.io_rx_kbs; last.ioWrite = d2.io_tx_kbs;
          last.appCpu = d2.app_cpu; last.appPss = d2.app_pss_mb; last.appRss = d2.app_rss_mb;
          last.appIoR = d2.app_io_r_kbs; last.appIoW = d2.app_io_w_kbs;
        }
      }
    }
    // 显示层产帧率(pts 差分,≈目标 APP 渲染帧率,perfDog 口径的"系统 fps"):
    // 最近 1s 有效 interval 均值的倒数,并入最近一条秒级记录(与两路 sysStat 同窗)
    var now1 = performance.now() / 1000;
    var cut1 = now1 - 1;
    var fi = frames.length - 1;
    while (fi >= 0 && frames[fi].t >= cut1) fi--;
    var inSum = 0, inN = 0;
    for (var fj = fi + 1; fj < frames.length; fj++) {
      if (frames[fj].interval != null) { inSum += frames[fj].interval; inN++; }
    }
    if (inN) {
      var lastS = stats[stats.length - 1];
      if (!lastS || now1 - lastS.t > 1.2) {
        lastS = { t: now1 };
        stats.push(lastS);
      }
      lastS.sysFps = Math.round(1000 / (inSum / inN));
    }
    // 只保留最大窗口内的数据,防止内存无限增长
    var cutoff = performance.now() / 1000 - MAX_WIN - 1;
    trimTo(frames, cutoff);
    trimTo(drops, cutoff);
  }

  function trimTo(arr, cutoff) {
    var i = 0;
    while (i < arr.length && arr[i].t < cutoff) i++;
    if (i > 0) arr.splice(0, i);
  }

  /* ---------------- 控件 ---------------- */
  var pauseBtn = document.getElementById('pauseBtn');
  pauseBtn.addEventListener('click', function () {
    paused = !paused;
    pauseBtn.classList.toggle('paused', paused);
    pauseBtn.textContent = paused ? '▶ Resume' : '⏸ Pause';
    if (!paused) { prevPtsMs = -1; prevTsMs = -1; prevSeq = -1; intervalBase = -1; pendingRaw.length = 0; }
  });
  document.getElementById('clearBtn').addEventListener('click', function () {
    frames.length = 0;
    stats.length = 0;
    drops.length = 0;
    prevPtsMs = -1;
    prevTsMs = -1;
    prevSeq = -1;
    intervalBase = -1;
  });

  // 包名输入:回车后经 ws 反向通知 app.js 开始/停止该 APP 的 CPU/PSS/IO 采样
  var pkgInput = document.getElementById('pkgInput');
  pkgInput.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter') return;
    var pkg = pkgInput.value.trim();
    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({ setPkg: pkg || null }));
      pkgInput.blur();
    }
  });

  // Tab 切换:两组与 header 专属控件互斥展示(body[data-tab] 驱动 CSS 显隐),
  // 后台组数据照常入队(不丢),切回即完整
  var tabEnc = document.getElementById('tabEnc');
  var tabSys = document.getElementById('tabSys');
  function switchTab(active) {
    document.body.dataset.tab = active;
    groupSections.enc.classList.toggle('hidden', active !== 'enc');
    groupSections.sys.classList.toggle('hidden', active !== 'sys');
    tabEnc.classList.toggle('on', active === 'enc');
    tabSys.classList.toggle('on', active === 'sys');
  }
  switchTab('enc');
  tabEnc.addEventListener('click', function () { switchTab('enc'); });
  tabSys.addEventListener('click', function () { switchTab('sys'); });
  // 导出当前保留窗口(≤MAX_WIN+1s)的帧级数据;Excel 友好(UTF-8 BOM)
  document.getElementById('exportBtn').addEventListener('click', function () {
    var head = 'seq,pts_ms,ts_ms,size_B,qp,encode_cost_ms,isKeyFrame,in_interval_ms,out_interval_ms,jitter_ms,out_minus_in_ms';
    var rows = [];
    for (var i = 0; i < frames.length; i++) {
      var f = frames[i];
      rows.push([f.seq, f.pts_ms, f.ts_ms, f.size, f.qp, f.cost, f.key,
                 f.interval == null ? '' : f.interval,
                 f.outInterval == null ? '' : f.outInterval,
                 f.jitter == null ? '' : f.jitter,
                 f.lag == null ? '' : f.lag].join(','));
    }
    if (!rows.length) { alert('No data'); return; }
    var blob = new Blob(['\ufeff' + head + '\n' + rows.join('\n') + '\n'], { type: 'text/csv' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'encode_frames_' + new Date().toISOString().replace(/[:.]/g, '-') + '.csv';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  // 导出秒级汇总:1Hz 记录(fps/码率/系统/APP 指标,缺席列为空)
  document.getElementById('exportSysBtn').addEventListener('click', function () {
    var cols = ['fps', 'sysFps', 'kbps', 'cpuTotal', 'appCpu', 'appPss', 'appRss', 'appIoR', 'appIoW',
                'gpuUtil', 'ioRead', 'ioWrite', 'netRx', 'netTx', 'memAvail', 'tempC', 'battPct'];
    var head = 't_s,' + cols.join(',');
    var rows = [];
    for (var i = 0; i < stats.length; i++) {
      var r = stats[i];
      rows.push([r.t.toFixed(1)].concat(cols.map(function (k) {
        return r[k] == null ? '' : r[k];
      })).join(','));
    }
    if (!rows.length) { alert('No data'); return; }
    var blob = new Blob(['\ufeff' + head + '\n' + rows.join('\n') + '\n'], { type: 'text/csv' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'encode_stats_' + new Date().toISOString().replace(/[:.]/g, '-') + '.csv';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  /* ---------------- 绘制 ---------------- */
  var GRID = '#232b36';
  var GRID_MINOR = '#1b212b';
  var AXIS_TEXT = '#7b8694';

  function setupCanvas(c) {
    var dpr = window.devicePixelRatio || 1;
    var w = c.canvas.clientWidth, h = c.canvas.clientHeight;
    if (!w || !h) return;
    if (c.canvas.width !== Math.round(w * dpr) || c.canvas.height !== Math.round(h * dpr)) {
      c.canvas.width = Math.round(w * dpr);
      c.canvas.height = Math.round(h * dpr);
    }
    c.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.w = w; c.h = h;
    c.padL = 44; c.padR = 10; c.padT = 6; c.padB = 18;
  }

  function niceXStep(win) {
    var raw = win / 8;
    var steps = [1, 2, 5, 10, 15, 30];
    for (var i = 0; i < steps.length; i++) if (steps[i] >= raw) return steps[i];
    return 30;
  }

  // 折线绘制(null 值断线);in/out 对比卡复用画第二条
  function drawLine(ctx, c, arr, i0, xOf, yOf, color, get) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    var started = false;
    for (var i = i0; i < arr.length; i++) {
      var v = get(arr[i]);
      // gapJoin(慢速系统指标):缺口不断线直连,避免 1Hz 采样抖动把曲线切碎;帧级曲线保持断线语义
      if (v == null || !isFinite(v)) { if (!c.gapJoin) started = false; continue; }
      var x = xOf(arr[i].t), y = yOf(v);
      if (!started) { ctx.moveTo(x, y); started = true; }
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.lineWidth = 1;
  }

  function drawChart(c, tNow) {
    setupCanvas(c);
    var ctx = c.ctx;
    if (!c.w) return;
    ctx.clearRect(0, 0, c.w, c.h);
    var padL = c.padL, padR = c.padR, padT = c.padT, padB = c.padB;
    var plotW = c.w - padL - padR, plotH = c.h - padT - padB;
    var t0 = tNow - c.win;

    function xOf(t) { return padL + (t - t0) / c.win * plotW; }
    function yOf(v) { return padT + (1 - (v - c.yMin) / (c.yMax - c.yMin)) * plotH; }

    // ---- 网格 + Y 刻度 ----
    ctx.font = '10px sans-serif';
    ctx.fillStyle = AXIS_TEXT;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    var minor = c.yStep <= 5 ? c.yStep / 5 * 5 : c.yStep; // QP/FPS 细网格 5
    for (var v = c.yMin; v <= c.yMax + 1e-9; v += (c.yStep <= 5 ? 5 : c.yStep)) {
      var y = yOf(v);
      ctx.strokeStyle = GRID_MINOR;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(c.w - padR, y); ctx.stroke();
    }
    for (v = c.yMin; v <= c.yMax + 1e-9; v += c.yLabelStep) {
      y = yOf(v);
      ctx.strokeStyle = GRID;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(c.w - padR, y); ctx.stroke();
      ctx.fillText(String(Math.round(v)), padL - 6, y);
    }

    // ---- X 刻度(相对会话起点的秒) ----
    var xStep = niceXStep(c.win);
    var tSession = tNow - sessionStart;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    var tFirst = Math.ceil((t0 - sessionStart) / xStep) * xStep + sessionStart;
    for (var t = tFirst; t <= tNow + 1e-9; t += xStep) {
      var x = xOf(t);
      ctx.strokeStyle = GRID;
      ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT + plotH); ctx.stroke();
      ctx.fillText(String(Math.round(t - sessionStart)), x, padT + plotH + 4);
    }

    // ---- 窗口内数据 + 统计 ----
    var arr = c.src, i0 = 0;
    while (i0 < arr.length && arr[i0].t < t0) i0++;
    var pts = [];
    for (var i = i0; i < arr.length; i++) {
      var val = c.get(arr[i]);
      if (val != null && isFinite(val)) pts.push({ x: xOf(arr[i].t), v: val, d: arr[i] });
    }
    if (pts.length) {
      var minV = Infinity, maxV = -Infinity, sum = 0;
      for (i = 0; i < pts.length; i++) {
        var pv = pts[i].v;
        if (pv < minV) minV = pv;
        if (pv > maxV) maxV = pv;
        sum += pv;
      }
      var last = pts[pts.length - 1].v;
      c.statsEl.innerHTML = 'cur <b>' + last.toFixed(c.digits) + '</b>' +
        ' max <b>' + maxV.toFixed(c.digits) + '</b>' +
        ' avg <b>' + (sum / pts.length).toFixed(c.digits) + '</b>' + c.unit;
      // 超出 Y 轴上限的值(如 cost 偶发 >60ms)裁剪在绘图区内,贴顶显示
      ctx.save();
      ctx.beginPath();
      ctx.rect(padL, padT, plotW, plotH);
      ctx.clip();
      if (c.kind === 'bar') {
        var slot = Math.max(plotW / (c.win * (c.id === 'size' ? 60 : 1)) - 1, 1);
        slot = Math.min(slot, 18);
        for (i = 0; i < pts.length; i++) {
          var p = pts[i];
          var yv = yOf(p.v);
          ctx.fillStyle = (c.id === 'size' && p.d.key) ? '#f75f5f' : c.color;
          ctx.fillRect(p.x - slot / 2, yv, slot, padT + plotH - yv);
        }
      } else {
        for (var si = 0; si < c.series.length; si++) {
          if (!c.series[si].hidden) {
            drawLine(ctx, c, arr, i0, xOf, yOf, c.series[si].color, c.series[si].get);
          }
        }
      }
      ctx.restore();
    } else {
      c.statsEl.textContent = 'waiting…';
    }

    // ---- 零线加亮(interval 图负值区) ----
    if (c.yMin < 0) {
      var yz = yOf(0);
      ctx.strokeStyle = '#3a4452';
      ctx.beginPath(); ctx.moveTo(padL, yz); ctx.lineTo(c.w - padR, yz); ctx.stroke();
    }
    // 边框
    ctx.strokeStyle = GRID;
    ctx.strokeRect(padL, padT, plotW, plotH);
  }

  // 顶部徽标:累计丢帧、系统状态(最近一条 sysStat);in/out 间隔不再展示,数据保留在 frames/CSV
  var badgeDrop = document.getElementById('badgeDrop');
  var badgeSys = document.getElementById('badgeSys');
  function updateBadges() {
    var dropped = drops.reduce(function (s, d) { return s + d.n; }, 0);
    var db = badgeDrop.querySelector('b');
    db.textContent = dropped;
    badgeDrop.classList.toggle('alert', dropped > 0);
    // 系统状态:倒序找最近一条带系统字段的记录(3s 内才显示,避免陈值)
    for (var k = stats.length - 1; k >= 0; k--) {
      if (performance.now() / 1000 - stats[k].t > 3) break;
      if (stats[k].tempC != null || stats[k].battPct != null || stats[k].memAvail != null) {
        var r = stats[k];
        var temp = r.tempC != null ? Math.round(r.tempC) + '℃' : '--℃';
        var batt = r.battPct != null ? Math.round(r.battPct) + '%' : '--%';
        var avail = r.memAvail != null ? (r.memAvail / 1024).toFixed(1) + 'G' : '--G';
        badgeSys.textContent = temp + ' · ⚡' + batt + ' · avail ' + avail;
        badgeSys.classList.toggle('alert', r.tempC != null && r.tempC >= 45);
        break;
      }
    }
  }

  var sessionStart = performance.now() / 1000;

  var pauseT = -1; // 暂停时刻的时间基准:冻结窗口,图表仍可缩放交互

  function tick() {
    var tNow;
    if (paused) {
      if (pauseT < 0) pauseT = performance.now() / 1000;
      tNow = pauseT;
    } else {
      pauseT = -1;
      drainPending();
      tNow = performance.now() / 1000;
    }
    for (var i = 0; i < CHARTS.length; i++) drawChart(CHARTS[i], tNow);
    if (!paused) updateBadges();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // 尺寸自适应(canvas 由 CSS 撑开,此处仅需触发重绘,tick 每帧 setupCanvas)
  window.addEventListener('resize', function () {}, { passive: true });
  </script>
</body>
</html>
